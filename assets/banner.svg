  <ellipse cx="60" cy="380" rx="110" ry="56" fill="#323d47" opacity=".8"/>
  <g transform="translate(150 70) scale(3.2)">
    <path d="M33 46C31 18 69 18 67 46" fill="none" stroke="#e4dacc" stroke-width="9" stroke-linecap="round"/>
    <circle cx="50" cy="62" r="28" fill="#e4dacc"/>
    <path d="M24 54C22 40 34 33 50 33C66 33 78 40 76 54C72 50 68 56 63 52C59 57 54 51 50 55C46 50 41 57 37 52C32 56 28 50 24 54Z" fill="#8a9a5b"/>
